services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: bekas-docs:latest
    container_name: bekas-docs
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
