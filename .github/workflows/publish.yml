name: Test, Build & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Cross-platform test matrix
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    name: Build & publish to PyPI
    needs: [tests]
    runs-on: ubuntu-latest
    # The PyPI trusted publisher (OIDC) must be configured with this
    # workflow path and environment name: pypi.org → bekas → Publishing.
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Verify tag matches package version
      if: github.event_name == 'release'
      env:
        EXPECTED_TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION=$(grep -oP '__version__ = "\K[^"]+' src/bekas/__init__.py)
        if [ -z "$VERSION" ]; then
          echo "Could not read version from src/bekas/__init__.py" >&2
          exit 1
        fi
        if [ "v$VERSION" != "$EXPECTED_TAG" ]; then
          echo "Release tag $EXPECTED_TAG does not match package version $VERSION" >&2
          exit 1
        fi
        echo "Tag matches package version: v$VERSION"

    - name: Build distributions
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1