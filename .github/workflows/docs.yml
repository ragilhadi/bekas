name: Build and Deploy Docs bekas

on:
  push:
    branches: [master]
    paths:
      - "src/bekas/__init__.py"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [master]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

env:
  REGISTRY: ${{ secrets.REGISTRY_HOST }}
  IMAGE_NAME: ${{ secrets.APP_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package
        id: version
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/bekas/__init__.py)
          if [ -z "$VERSION" ]; then
            echo "Error: could not read version from src/bekas/__init__.py"
            exit 1
          fi
          VERSION="v$VERSION"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format. Expected format: v1.0.0"
            echo "Current version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version validated: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to private registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: docs-site
          file: ./docs-site/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
